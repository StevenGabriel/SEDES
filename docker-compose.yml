services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sedes_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:password123@db:5432/sedes_db}
      - SECRET_KEY=${SECRET_KEY:-sedes_cochabamba_jwt_secret_key_2026_production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://sedeslaboratorios.umaunivalle.com}
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data: